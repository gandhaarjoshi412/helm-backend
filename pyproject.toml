[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helm-agent"
version = "0.1.0"
description = "HELM: Autonomous Software Engineering Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HELM Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "openai>=1.14.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "docker>=7.0.0",
    "gitpython>=3.1.42",
    "rich>=13.7.1",
    "python-multipart>=0.0.9",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.3",
    "mypy>=1.9.0",
    "httpx>=0.27.0"
]

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["tests*", "infra*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
