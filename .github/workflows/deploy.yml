name: Deploy Backend to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            echo "🚀 Starting deployment on server..."
            cd /home/ubuntu/iqoo_backend

            echo "📥 Fetching and resetting to latest origin/main..."
            git fetch origin main
            git reset --hard origin/main

            echo "📦 Updating python package..."
            source venv/bin/activate
            pip install -e . --no-deps

            echo "🔄 Restarting iqoo-backend systemd service..."
            sudo systemctl restart iqoo-backend.service

            echo "⏳ Checking service health..."
            for i in $(seq 1 15); do
              if curl -sSf http://127.0.0.1:8800/health > /dev/null 2>&1; then
                echo "✅ Service is up and healthy!"
                curl -s http://127.0.0.1:8800/health
                echo ""
                exit 0
              fi
              echo "Waiting for service to become healthy ($i/15)..."
              sleep 2
            done

            echo "❌ Service failed to become healthy within timeout!"
            sudo systemctl status iqoo-backend.service --no-pager
            exit 1
